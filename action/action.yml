name: "Circles Vault Secrets"
description: >-
  Fetch secrets from Circles Vault using GitHub OIDC — no stored tokens.
  Requires `permissions: id-token: write` on the job.
inputs:
  host:
    description: "Vault endpoint including org, e.g. https://vault.circles.ac/circlesac"
    required: true
  env-file:
    description: "Env file with KEY=<secret reference> lines (op:// or vlt://)"
    required: false
    default: ""
  export-env:
    description: "Resolve env-file entries into $GITHUB_ENV (masked). When false, use 'vlt run --env-file' in your own steps."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install vlt
      shell: bash
      run: |
        if ! command -v vlt >/dev/null 2>&1; then
          npm install -g @circlesac/vlt-cli
        fi

    - name: Configure endpoint
      shell: bash
      run: echo "OP_CONNECT_HOST=${{ inputs.host }}" >> "$GITHUB_ENV"

    - name: Export secrets to environment
      if: inputs.export-env == 'true' && inputs.env-file != ''
      shell: bash
      env:
        VLT_ENV_FILE: ${{ inputs.env-file }}
      run: |
        set -euo pipefail
        while IFS= read -r line || [ -n "$line" ]; do
          case "$line" in ''|'#'*) continue ;; esac
          key="${line%%=*}"
          ref="${line#*=}"
          case "$ref" in
            op://*|vlt://*)
              value="$(vlt read "$ref")"
              # Mask every line of the value before it can appear in logs
              while IFS= read -r vline; do
                [ -n "$vline" ] && echo "::add-mask::$vline"
              done <<< "$value"
              {
                echo "${key}<<__VLT_EOF__"
                echo "$value"
                echo "__VLT_EOF__"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "${key}=${ref}" >> "$GITHUB_ENV"
              ;;
          esac
        done < "$VLT_ENV_FILE"
