name: E2EE KMS Deny Test

on:
  push:
    branches: [feat/17-client-e2ee]
    paths: [.github/workflows/e2ee-kms-deny-test.yml]

permissions:
  contents: read
  id-token: write

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: circles-api-427505
          workload_identity_provider: projects/893953183722/locations/global/workloadIdentityPools/vault-github/providers/github
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify unlisted repository denial
        env:
          CIPHERTEXT: ""
        run: |
          printf "%s" "$CIPHERTEXT" | base64 --decode > ciphertext.bin
          if gcloud kms asymmetric-decrypt +            --project=circles-api-427505 +            --location=global +            --keyring=vault +            --key=cvlt-e2ee +            --version=1 +            --ciphertext-file=ciphertext.bin +            --plaintext-file=plaintext.bin; then
            echo "unlisted repository unexpectedly decrypted" >&2
            exit 1
          fi
          echo "unlisted repository denied by KMS"
